<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="lhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d5bbf" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50e3c2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e9a78" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="patchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d0021b" stop-opacity="0.8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#495057"/>
    </marker>
  </defs>

  <rect width="800" height="320" fill="#ffffff" rx="8"/>

  <!-- Step 1: Bilateral Mesh & Sagittal Cut Plane -->
  <g transform="translate(40, 30)">
    <text x="100" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">1. Bilateral Input Mesh</text>
    <ellipse cx="65" cy="130" rx="45" ry="75" fill="url(#lhGrad)" stroke="#1d5bbf" stroke-width="2"/>
    <ellipse cx="135" cy="130" rx="45" ry="75" fill="url(#rhGrad)" stroke="#0e9a78" stroke-width="2"/>
    <!-- Cutting Plane -->
    <line x1="100" y1="35" x2="100" y2="235" stroke="#e02020" stroke-width="2.5" stroke-dasharray="6,4"/>
    <rect x="88" y="240" width="24" height="18" fill="#e02020" rx="3"/>
    <text x="100" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">x=0</text>
    <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Sagittal Cut Plane</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="160" x2="295" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Minimal Contour & Medial Seam -->
  <g transform="translate(305, 30)">
    <text x="100" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">2. Contour Optimization</text>
    <ellipse cx="100" cy="130" rx="35" ry="70" fill="none" stroke="#e02020" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- Contour points -->
    <circle cx="100" cy="60" r="4" fill="#e02020"/>
    <circle cx="135" cy="130" r="4" fill="#e02020"/>
    <circle cx="100" cy="200" r="4" fill="#e02020"/>
    <circle cx="65" cy="130" r="4" fill="#e02020"/>
    <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#212529" font-weight="600" text-anchor="middle">Min-Cut Loop (101 planes)</text>
    <text x="100" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Evaluates length &amp; curvature</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="520" y1="160" x2="555" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Delaunay Disk Patch & Harmonic Interior Filling -->
  <g transform="translate(565, 30)">
    <text x="100" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">3. Medial Wall Closure</text>
    <ellipse cx="60" cy="130" rx="40" ry="70" fill="url(#lhGrad)" stroke="#1d5bbf" stroke-width="1.5"/>
    <!-- Medial patch -->
    <path d="M 60 60 Q 95 130 60 200 Z" fill="url(#patchGrad)" stroke="#d0021b" stroke-width="1.5"/>
    <text x="60" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">Delaunay Disk Patching</text>
    <text x="60" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Harmonic coordinates (genus 0)</text>
    <text x="155" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0e9a78">lh + rh</text>
  </g>
</svg>
