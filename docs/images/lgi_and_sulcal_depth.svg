<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sulcDepthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e02020" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0.45"/>
    </radialGradient>
    <marker id="depthArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d0021b"/>
    </marker>
  </defs>

  <rect width="800" height="320" fill="#ffffff" rx="8"/>

  <!-- Left Panel: Local Gyrification Index (LGI) -->
  <g transform="translate(30, 25)">
    <text x="170" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">A. Local Gyrification Index (LGI)</text>
    
    <!-- Outer Hull (Smooth Convex Wrapping) -->
    <path d="M 30 180 C 70 80 270 80 310 180" fill="none" stroke="#2da44e" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Pial Folded Surface -->
    <path d="M 30 180 C 60 100 80 100 110 180 C 130 230 150 230 170 120 C 190 70 210 70 230 180 C 250 230 270 230 290 140 C 300 100 305 100 310 180" fill="none" stroke="#0969da" stroke-width="2.5"/>

    <!-- Spherical ROI Ball B(x, r) -->
    <circle cx="170" cy="150" r="55" fill="url(#sphereGrad)" stroke="#0969da" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="170" cy="120" r="4" fill="#d0021b"/>
    <text x="170" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d0021b" text-anchor="middle">Vertex x</text>

    <!-- Formula & Legend -->
    <text x="170" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1b1f24" text-anchor="middle">LGI(x) = Area(Pial ∩ B) / Area(Hull ∩ B)</text>
    <text x="170" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2da44e" text-anchor="middle">Green: Outer Cerebral Hull (shrink-wrapped)</text>
    <text x="170" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0969da" text-anchor="middle">Blue: Intricate Pial Cortical Surface</text>
  </g>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="290" stroke="#e1e4e8" stroke-width="1.5"/>

  <!-- Right Panel: Geodesic Sulcal Depth (SD) -->
  <g transform="translate(430, 25)">
    <text x="170" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1b1f24" text-anchor="middle">B. Geodesic Sulcal Depth (SD)</text>

    <!-- Outer Hull Contact Line -->
    <line x1="40" y1="90" x2="300" y2="90" stroke="#2da44e" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="310" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2da44e">Hull contact</text>

    <!-- Deep Sulcal Fold -->
    <path d="M 40 90 C 90 90 100 230 170 230 C 240 230 250 90 300 90" fill="url(#sulcDepthGrad)" stroke="#0969da" stroke-width="2.5"/>

    <!-- Depth measurement arrow -->
    <line x1="170" y1="90" x2="170" y2="225" stroke="#d0021b" stroke-width="2.5" marker-end="url(#depthArrow)"/>
    <circle cx="170" cy="230" r="4" fill="#d0021b"/>
    
    <text x="180" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d0021b">Sulcal Depth d</text>
    <text x="170" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#212529" text-anchor="middle">Sulcal Fundus</text>

    <!-- Description -->
    <text x="170" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Geodesic distance along cortical manifold</text>
    <text x="170" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#495057" text-anchor="middle">from convex hull contact boundary</text>
  </g>
</svg>
