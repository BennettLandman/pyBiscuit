name: Reference (image goldens)

# MANUAL ONLY and NOT READY TO RUN until the owner answers open question Q1
# (docs/open-questions.md): it needs the FC image as a release asset of this private repo and
# the FreeSurfer licence as a repository secret. Nothing here triggers automatically.
# The image and the licence are never committed or published; goldens are uploaded as a
# workflow artifact for the owner to review and commit by hand.
# See scripts/reference/README.md for the exact inputs.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN to confirm the image release asset and FS_LICENSE secret exist (Q1)"
        type: string
        required: true
      release_tag:
        description: "Release tag that holds the image asset"
        type: string
        required: true
      sif_asset:
        description: "Image asset name"
        type: string
        default: biscuit_FC_v2.2.sif
      sif_sha256:
        description: "Expected SHA-256 of the image"
        type: string
        default: e70aea6290ca3312a290618a8092b8992444bc47a7d3b42680109dfd714d4329
      apptainer_version:
        description: "Apptainer release to install"
        type: string
        default: "1.3.4"
      full_case_asset:
        description: "Optional: release asset (tar.gz of a MaCRUISE v3 input dir) for a full run (B1.1+B1.2); empty = per-tool goldens only"
        type: string
        default: ""
      full_case_sha256:
        description: "SHA-256 of the full-run case asset (required when full_case_asset is set)"
        type: string
        default: ""
      reg:
        description: "Registration template for the full run (--reg)"
        type: string
        default: oasis45

permissions:
  contents: read

jobs:
  harvest:
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SIF_ASSET: ${{ inputs.sif_asset }}
      SIF_SHA256: ${{ inputs.sif_sha256 }}
      APPTAINER_VERSION: ${{ inputs.apptainer_version }}
      CASE_ASSET: ${{ inputs.full_case_asset }}
      CASE_SHA256: ${{ inputs.full_case_sha256 }}
      REG: ${{ inputs.reg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pybiscuit (fixture generators)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install Apptainer
        run: |
          curl -fsSL -o apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./apptainer.deb squashfs-tools fuse2fs
          # Ubuntu 24.04 runners restrict unprivileged user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          apptainer --version
      - name: Download and verify the image
        run: |
          mkdir -p "$RUNNER_TEMP/sif"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$SIF_ASSET" --dir "$RUNNER_TEMP/sif"
          echo "$SIF_SHA256  $RUNNER_TEMP/sif/$SIF_ASSET" | sha256sum -c -
      - name: Per-tool goldens (B1.4)
        run: |
          python scripts/reference/make_image_golden.py \
            --sif "$RUNNER_TEMP/sif/$SIF_ASSET" --sif-sha256 "$SIF_SHA256" \
            --all --keep-going --out "$RUNNER_TEMP/golden-image"
      - name: Full run with command trace (B1.1, B1.2)
        if: ${{ inputs.full_case_asset != '' }}
        env:
          FS_LICENSE_TEXT: ${{ secrets.FS_LICENSE }}
        run: |
          [ -n "$CASE_SHA256" ] || { echo "full_case_sha256 is required" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/case" "$RUNNER_TEMP/full"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$CASE_ASSET" --dir "$RUNNER_TEMP/case"
          echo "$CASE_SHA256  $RUNNER_TEMP/case/$CASE_ASSET" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/case/$CASE_ASSET" -C "$RUNNER_TEMP/case"
          (umask 077; printf '%s\n' "$FS_LICENSE_TEXT" > "$RUNNER_TEMP/license.txt")
          scripts/reference/run_full.sh \
            --sif "$RUNNER_TEMP/sif/$SIF_ASSET" --sif-sha256 "$SIF_SHA256" \
            --input "$RUNNER_TEMP/case/input" --out "$RUNNER_TEMP/full/run" \
            --license "$RUNNER_TEMP/license.txt" --reg "$REG"
          python scripts/reference/trace_to_spec.py "$RUNNER_TEMP/full/run.harness/trace.jsonl" \
            -o "$RUNNER_TEMP/full/orchestrator-trace.md"
      - name: Remove the licence file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/license.txt"
      - name: Upload goldens (review and commit by hand)
        uses: actions/upload-artifact@v4
        with:
          name: image-goldens
          path: ${{ runner.temp }}/golden-image
          if-no-files-found: warn
          retention-days: 14
      - name: Upload full-run archive and trace
        if: ${{ inputs.full_case_asset != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-run
          path: |
            ${{ runner.temp }}/full/run.harness/run.tar.gz
            ${{ runner.temp }}/full/run.harness/MANIFEST.sha256
            ${{ runner.temp }}/full/run.harness/run.json
            ${{ runner.temp }}/full/run.harness/trace.jsonl
            ${{ runner.temp }}/full/orchestrator-trace.md
          retention-days: 14
