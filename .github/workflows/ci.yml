name: CI

# Minimal by default: one Linux job per PR/main push (cheap Actions minutes).
# Full OS/Python matrix is manual: Actions tab -> CI -> Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run ubuntu/macOS/windows x py3.10/3.13"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix) && fromJSON('["3.10","3.13"]') || fromJSON('["3.10"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check
      - name: Test (reference-marked tests auto-skip in CI)
        run: pytest -q
